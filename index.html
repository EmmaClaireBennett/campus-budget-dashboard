<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campus Budget Dashboard</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="shell"><header><div><p class="eyebrow">Student finance</p><h1>Campus Budget</h1><p class="muted">Understand where your money goes.</p></div><button id="reset" class="ghost">Reset data</button></header>
<section class="stats"><article><span>Total spent</span><strong id="total">$0.00</strong></article><article><span>This month</span><strong id="month">$0.00</strong></article><article><span>Transactions</span><strong id="count">0</strong></article></section>
<section class="panel"><h2>Add transaction</h2><form id="expense-form"><input id="amount" type="number" min="0.01" step="0.01" placeholder="Amount" required><select id="category"><option>Food</option><option>Transport</option><option>Books</option><option>Housing</option><option>Other</option></select><input id="note" placeholder="What was it for?" required><button>Add expense</button></form></section>
<section class="grid"><article class="panel"><div class="section-head"><h2>Spending by category</h2><button id="export" class="ghost">Export CSV</button></div><div id="bars" class="bars"></div></article><article class="panel"><div class="section-head"><h2>Transactions</h2><select id="filter"><option value="all">All categories</option><option>Food</option><option>Transport</option><option>Books</option><option>Housing</option><option>Other</option></select></div><div id="transactions" class="transactions"></div></article></section></main><script src="app.js"></script></body></html>
